name: Code Review

# Adversarial PR review by Claude on AWS Bedrock. Ported from equalify-iris's
# code-review.yml, which documents the history behind each guard in detail.
#
# Setup:
#   - secret   AWS_BEDROCK_ROLE_ARN  — IAM role assumable via OIDC with
#     bedrock:InvokeModel / InvokeModelWithResponseStream on the review model. Its
#     trust policy must allow repo:EqualifyEverything/equalify-iris-pdf:pull_request
#     and :ref:refs/heads/*; the role used by equalify-iris trusts only that repo.
#   - variable BEDROCK_REVIEW_MODEL (optional) — inference-profile ID; default below.
#   - The Claude GitHub App installed on this repo, so reviews post as claude[bot].
#
# Identity: claude-code-action swaps its OIDC token for a Claude App token, and
# that exchange refuses while this file differs from the default-branch copy — the
# action then skips itself. So a PR that edits this file is reviewed under an
# explicit GITHUB_TOKEN (posting as github-actions[bot]); every other PR is not.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, dependabot and forks (a fork's `pull_request` gets no secrets).
    # Review a fork PR by dispatch — `gh workflow run code-review.yml -f pr_number=<n>` —
    # after reading its diff: that runs the fork's code in a job holding the Bedrock role.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       ((github.event.action == 'ready_for_review' || github.event.pull_request.draft == false) &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    # Must exceed the model step's cap below, or a timeout cancels the fallback too.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve PR + head sha
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            META=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
            HEAD_SHA=$(echo "$META" | jq -r .head.sha)
            BASE_REF=$(echo "$META" | jq -r .base.ref)
            BASE_SHA=$(echo "$META" | jq -r .base.sha)
            HEAD_REPO=$(echo "$META" | jq -r .head.repo.full_name)
            git fetch origin "pull/$PR_NUMBER/head:pr-$PR_NUMBER"
            git checkout "pr-$PR_NUMBER"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_REPO="${{ github.repository }}" # the job condition admits only same-repo PRs
          fi
          # A fork's code must not run in this job: it holds id-token and the Bedrock role.
          if [ "$HEAD_REPO" = "${{ github.repository }}" ]; then echo "fork=false" >> "$GITHUB_OUTPUT"; else echo "fork=true" >> "$GITHUB_OUTPUT"; fi
          if gh pr diff "$PR_NUMBER" --name-only | grep -qx '.github/workflows/code-review.yml'; then
            echo "changed_workflow=code-review.yml" >> "$GITHUB_OUTPUT"
            # Single-quoted: the escaped open-expression on the `github.event.*` line
            # must survive Actions substitution without bash expanding it.
            {
              echo '### This PR changes `code-review.yml` — its review runs on the fallback token'
              echo
              echo 'The review still runs, but posts as **github-actions[bot]** rather than claude[bot].'
              echo
              echo '**Read the workflow diff yourself anyway.** The reviewer is reviewing the file that'
              echo 'decides whether anything gets reviewed. Check whether it lets PR-authored code run'
              echo 'with secrets, widens `permissions:`, interpolates attacker-controlled'
              echo '`${{ '${{' }} github.event.* }}` into a `run:` block, or weakens `Verify a review was posted`.'
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > /tmp/workflow-notice.md
            cat /tmp/workflow-notice.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed_workflow=none" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA"   >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF"   >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA"   >> "$GITHUB_OUTPUT"

      - name: Skip if a review already exists for this commit
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          SELF_EDIT: ${{ contains(steps.ctx.outputs.changed_workflow, 'code-review.yml') }}
        run: |
          set -euo pipefail
          # github-actions[bot] counts only on a self-editing PR, the one place a model
          # review posts under it. Fallback reviews never count: re-running to replace
          # one must not be a no-op.
          FALLBACK='## Automated review did not complete'
          if [ "${SELF_EDIT:-false}" = "true" ]; then
            LOGINS='["claude[bot]","github-actions[bot]"]'
          else
            LOGINS='["claude[bot]"]'
          fi
          COUNT=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --paginate \
            | jq --arg f "$FALLBACK" --arg sha "$HEAD_SHA" --argjson logins "$LOGINS" \
                '[.[] | select(.user.login | IN($logins[]))
                      | select(.commit_id==$sha)
                      | select(((.body // "") | startswith($f)) | not)] | length' \
            | awk '{s+=$1} END {print s+0}')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
            echo "A review already exists for $HEAD_SHA — skipping."
          else
            echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Say on the PR how its own review was produced
        # Courtesy notice; must never block the review, hence continue-on-error.
        if: >-
          steps.guard.outputs.already_reviewed != 'true' &&
          contains(steps.ctx.outputs.changed_workflow, 'code-review.yml')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set -euo pipefail
          # One comment per PR, edited in place on later pushes.
          MARKER='<!-- code-review: workflow-self-edit -->'
          BODY=/tmp/workflow-notice-comment.md
          { echo "$MARKER"; cat /tmp/workflow-notice.md; } > "$BODY"
          # --jq runs per page, so take the first line in bash (not `| head`, which
          # SIGPIPEs under pipefail).
          IDS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select((.body // \"\") | contains(\"$MARKER\")) | .id] | first // empty")
          ID=${IDS%%$'\n'*}
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$ID" \
              -f body="$(cat "$BODY")" --silent
          else
            gh pr comment "$PR_NUMBER" --body-file "$BODY"
          fi

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.already_reviewed != 'true'
        with:
          # Must match .nvmrc: the sources are .ts, run directly by Node's type stripping.
          node-version-file: .nvmrc
          cache: npm

      # For the OCR tests. Failure-tolerant like every step before the model: a
      # step that exits non-zero here would skip the fallback and verify steps.
      # Without Tesseract the OCR tests skip themselves; the warning says so.
      - name: Install Tesseract (OCR tests)
        if: steps.guard.outputs.already_reviewed != 'true'
        continue-on-error: true
        run: |
          if sudo apt-get update && sudo apt-get install -y tesseract-ocr; then
            echo "tesseract installed"
          else
            echo "::warning::tesseract-ocr failed to install; the OCR tests will skip. The review still runs."
          fi

      - name: Build review context
        if: steps.guard.outputs.already_reviewed != 'true'
        # Every check records pass/fail/skip into the context rather than failing the
        # step: a red check is what the reviewer needs to see, and a non-zero exit here
        # would skip the fallback and verify steps. Add the project's install / test
        # commands to the "Checks" block as code lands, in the same pattern.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          FORK: ${{ steps.ctx.outputs.fork }}
        run: |
          set -euo pipefail
          OUT=/tmp/review-context.md
          MAX_LINES_PER_FILE=800
          MAX_BYTES_PER_FILE=120000
          # Whole-file source only for files at least this % changed, or small ones.
          MIN_CHANGED_PCT=15
          ALWAYS_INCLUDE_UNDER_BYTES=8000
          # Always in full, whatever the ratio: small diffs here are the risky ones.
          ALWAYS_INCLUDE_PATHS=".github/"

          {
            echo "# Review context"
            echo
            echo "## PR metadata"
            echo '```json'
            gh pr view "$PR_NUMBER" --json number,title,author,body,baseRefName,headRefName
            echo '```'
          } > "$OUT"

          # Earlier model reviews on previous commits, most recent 3, each capped, so a
          # re-review builds on what was said instead of restarting from zero. Written
          # to a file and `tail`ed: piping `gh` into `tail` would SIGPIPE under pipefail.
          PRIOR_REVIEWS_MAX=3
          PRIOR_BODY_MAX=8000
          PRIOR_LINES=/tmp/prior-reviews.jsonl
          if gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --paginate \
               --jq ".[] | select(.user.login==\"claude[bot]\" or .user.login==\"github-actions[bot]\")
                        | select(.commit_id!=\"$HEAD_SHA\")
                        | select(((.body // \"\") | startswith(\"## Automated review did not complete\")) | not)
                        | {sha: .commit_id[0:7], state: .state, body: (.body // \"(empty)\")}
                        | @json" \
               > "$PRIOR_LINES" 2>/dev/null && [ -s "$PRIOR_LINES" ]; then
            {
              echo
              echo "## Your earlier reviews of this PR (previous commits)"
              echo
              echo "- **Fixed** in the current head: say so in one line."
              echo "- **Still present**: say it is unchanged since \`<sha>\`, briefly. If you have"
              echo "  raised it twice and the author pushed past it, say so once and leave it to a human."
              echo "- **Wrong**: withdraw it explicitly."
              echo "- Do not hunt for new findings just because the diff changed."
              echo
              echo "Each starts at \`=== REVIEW <state> on commit <sha> ===\`; headings inside are that review's."
              echo
            } >> "$OUT"
            tail -n "$PRIOR_REVIEWS_MAX" "$PRIOR_LINES" > /tmp/prior-recent.jsonl
            jq -r --argjson max "$PRIOR_BODY_MAX" \
              '"=== REVIEW \(.state) on commit \(.sha) ===\n\n\(.body[:$max])\n"
               + (if (.body | length) > $max then "\n_[body truncated]_\n" else "" end)' \
              /tmp/prior-recent.jsonl >> "$OUT"
          fi

          # --- Checks ---------------------------------------------------------------
          # actionlint: an Actions-expression error disables a whole workflow file
          # silently. Pinned and checksum-verified — this job holds id-token: write.
          { echo; echo "## Workflow lint — \`actionlint\`"; echo '```'; } >> "$OUT"
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          if curl -fsSL -o /tmp/actionlint.tgz \
               "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
             && echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c - >/dev/null 2>&1 \
             && tar -xzf /tmp/actionlint.tgz -C /tmp actionlint; then
            if /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml 2>&1 | tail -40 >> "$OUT"; then
              WFLINT=pass
            else
              WFLINT=fail
            fi
          else
            echo "(could not install actionlint v${ACTIONLINT_VERSION})" >> "$OUT"
            WFLINT=skip
          fi
          { echo '```'; echo; echo "Result: **$WFLINT**"; } >> "$OUT"

          { echo; echo "## Workflow scripts — \`shellcheck\`"; echo '```'; } >> "$OUT"
          if ! ls .github/scripts/*.sh >/dev/null 2>&1; then
            echo "(no .github/scripts/*.sh)" >> "$OUT"
            SCRIPT_LINT=skip
          elif shellcheck -s bash -S warning .github/scripts/*.sh 2>&1 | tail -40 >> "$OUT"; then
            SCRIPT_LINT=pass
          else
            SCRIPT_LINT=fail
          fi
          { echo '```'; echo; echo "Result: **$SCRIPT_LINT**"; } >> "$OUT"

          if [ "$FORK" = true ]; then
            # Running a fork's install scripts or tests here would hand them this job's credentials.
            { echo; echo "## Install, typecheck, unit tests"; echo; echo "Skipped: the head is a fork. See the Test workflow run on this PR."; } >> "$OUT"
            INSTALL=skip TYPECHECK=skip UNIT=skip
          else
            { echo; echo "## Install — \`npm ci\`"; echo '```'; } >> "$OUT"
            if npm ci 2>&1 | tail -40 >> "$OUT"; then INSTALL=pass; else INSTALL=fail; fi
            { echo '```'; echo; echo "Result: **$INSTALL**"; } >> "$OUT"

            { echo; echo "## Typecheck — \`npm run typecheck\`"; echo '```'; } >> "$OUT"
            if npm run typecheck 2>&1 | tail -80 >> "$OUT"; then TYPECHECK=pass; else TYPECHECK=fail; fi
            { echo '```'; echo; echo "Result: **$TYPECHECK**"; } >> "$OUT"

            { echo; echo "## Unit tests — \`npm test\`"; echo '```'; } >> "$OUT"
            if npm test 2>&1 | tail -120 >> "$OUT"; then UNIT=pass; else UNIT=fail; fi
            { echo '```'; echo; echo "Result: **$UNIT**"; } >> "$OUT"
          fi

          # Also written to its own file so the fallback step can cat it without a pipe.
          SUMMARY=$(printf '## Check summary\n- workflow lint (`actionlint`): %s\n- workflow scripts (`shellcheck`): %s\n- npm ci: %s\n- typecheck: %s\n- unit (`npm test`): %s\n' \
            "$WFLINT" "$SCRIPT_LINT" "$INSTALL" "$TYPECHECK" "$UNIT")
          { echo; echo "$SUMMARY"; } >> "$OUT"
          echo "$SUMMARY" | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/check-summary.md
          if [ "$WFLINT" = fail ] || [ "$SCRIPT_LINT" = fail ] || { [ "$FORK" != true ] && [ "$INSTALL$TYPECHECK$UNIT" != passpasspass ]; }; then
            echo "::warning::One or more checks failed — the review continues so Claude reports it."
          fi

          # --- Diff -----------------------------------------------------------------
          # Against the PR's recorded base sha, not `merge-base origin/$BASE_REF HEAD`,
          # which is empty once the base contains HEAD (e.g. a dispatch after merge).
          MERGE_BASE="$BASE_SHA"
          if ! git cat-file -e "$MERGE_BASE^{commit}" 2>/dev/null; then
            echo "::warning::base sha $MERGE_BASE not found; falling back to merge-base against origin/$BASE_REF"
            git fetch origin "$BASE_REF" || true
            MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          fi
          {
            echo
            if [ -z "$(git diff --name-only "$MERGE_BASE"...HEAD)" ]; then
              echo "## ⚠️ NO CHANGES TO REVIEW"
              echo
              echo "The diff against \`$MERGE_BASE\` is empty. **Do not approve.** Post one"
              echo "\`--request-changes\` saying the PR could not be reviewed, and stop."
              echo
            fi
            echo "## Changed files (base \`$MERGE_BASE\`)"
            echo '```'
            git diff --name-status "$MERGE_BASE"...HEAD
            echo '```'
            echo
            echo "## Full diff"
            echo '```diff'
            git diff "$MERGE_BASE"...HEAD
            echo '```'
            echo
            echo "## Full source of new / substantially-rewritten files"
            echo
            echo "Files changed by under ${MIN_CHANGED_PCT}% are omitted; Read them if needed."
          } >> "$OUT"

          # Marks a cut so a partial file is never read as whole. awk on stdin: an
          # argument containing `=` would be read as an assignment.
          emit_source() {
            head -n "$MAX_LINES_PER_FILE" "$1" >> "$OUT"
            N=$(awk 'END{print NR}' < "$1")
            [ "${N:-0}" -le "$MAX_LINES_PER_FILE" ] || printf \
              '\n... TRUNCATED at %s of %s lines. Read the file for the rest.\n' \
              "$MAX_LINES_PER_FILE" "$N" >> "$OUT"
          }

          git diff --name-only --diff-filter=AM "$MERGE_BASE"...HEAD | while read -r f; do
            [ -f "$f" ] || continue
            if file --mime "$f" | grep -q 'charset=binary'; then
              printf '\n### %s\n\n_(binary — skipped)_\n' "$f" >> "$OUT"
              continue
            fi
            BYTES=$(wc -c < "$f" | tr -d ' ')
            if [ "$BYTES" -gt "$MAX_BYTES_PER_FILE" ]; then
              printf '\n### %s\n\n_(%s bytes — too large, see diff above)_\n' "$f" "$BYTES" >> "$OUT"
              continue
            fi
            FORCED=no
            for p in $ALWAYS_INCLUDE_PATHS; do
              case "$f" in "$p"*) FORCED=yes; break ;; esac
            done
            if [ "$FORCED" = no ] && [ "$BYTES" -gt "$ALWAYS_INCLUDE_UNDER_BYTES" ]; then
              CHANGED=$(git diff --numstat "$MERGE_BASE"...HEAD -- "$f" | awk '{print $1 + $2}')
              LINES=$(wc -l < "$f" | tr -d ' ')
              PCT=100
              [ "${LINES:-0}" -eq 0 ] || PCT=$(( ${CHANGED:-0} * 100 / LINES ))
              if [ "$PCT" -lt "$MIN_CHANGED_PCT" ]; then
                printf '\n### %s\n\n_(%s%% of %s lines changed — see diff)_\n' "$f" "$PCT" "$LINES" >> "$OUT"
                continue
              fi
            fi
            printf '\n### %s\n\n```\n' "$f" >> "$OUT"
            emit_source "$f"
            printf '\n```\n' >> "$OUT"
          done

          echo "context: $(wc -c < "$OUT" | tr -d ' ') bytes"

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.already_reviewed != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: us-east-2

      - name: Claude review
        id: claude
        if: steps.guard.outputs.already_reviewed != 'true'
        # A step timeout fails only this step, so the fallback still posts a verdict.
        # `bun install` inside the action (up to ~3 min) counts against these 22.
        timeout-minutes: 22
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Non-empty only on a self-editing PR; see the header comment.
          github_token: ${{ contains(steps.ctx.outputs.changed_workflow, 'code-review.yml') && secrets.GITHUB_TOKEN || '' }}
          use_bedrock: "true"
          allowed_bots: "claude"
          # display_report unset: it would double-submit alongside `gh pr review`.
          claude_args: >-
            --allowedTools Bash(*),Read(*),Glob,Grep
            --model ${{ vars.BEDROCK_REVIEW_MODEL || 'us.anthropic.claude-opus-5' }}
          prompt: |
            You are an adversarial code reviewer for **equalify-iris-pdf**, reviewing
            PR #${{ steps.ctx.outputs.pr_number }} (head ${{ steps.ctx.outputs.head_sha }}) in
            ${{ github.repository }}. Your job is to find what is wrong, not to confirm what is right.
            You advise the repo's primary maintainer (the Iris PDF Maintainer agent); your verdict
            is input to them.

            Read `/tmp/review-context.md` FIRST: PR metadata, check results ("Check summary"),
            the full diff and the full source of new or rewritten files. If it has "Your earlier
            reviews of this PR", read that first and follow it. Read `CLAUDE.md` for the repo's
            standards. Use Read/Glob/Grep only for what the context omits. Do not re-run checks.

            ## Time budget

            ~19 minutes of wall clock, then you are killed. **Append each confirmed finding to
            `/tmp/review-findings.md` immediately** — if you are cut off, that file is posted.
            Check `date` around minute 13 and post. Three verified blocking issues beat twelve
            speculative ones.

            ## What this library is

            It takes accessible HTML (typically produced by equalify-iris from page images) and
            uses it to tag and update a PDF: building the structure tree, reading order, alt text,
            language, title and other metadata so the PDF is accessible. License AGPL-3.0-or-later.

            ## Severity bar

            **Blocking** only if real input, a real user or CI reaches it today. A real but
            unreachable defect is a **non-blocking note** on an approval — say what would make it
            reachable. Always blocking regardless of reachability: security issues (untrusted PDF
            or HTML input, path traversal, secrets), and license violations.

            ## Must flag (blocking)

            1. **Accessibility of the output PDF.** This is the product. Wrong or missing
               structure elements, broken reading order, headings/lists/tables (headers, scope)
               mis-mapped from the HTML, lost alt text, missing `/Lang` or title, artifacts tagged
               as content (or content as artifacts), marked content not tied to the structure
               tree, or anything that regresses PDF/UA conformance. A tagged PDF that is less
               accessible than its source HTML is a bug.
            2. **Document integrity.** Updating a PDF must not corrupt it, drop visible content,
               change its rendering, or break incremental-update / xref structure.
            3. **Untrusted input.** PDFs and HTML are attacker-controllable. Flag unbounded
               memory or recursion, missing size/page limits, shelling out with unescaped input,
               path handling that can escape its directory, and script or external-resource
               loading from HTML.
            4. **Correctness and regressions.** Logic bugs, unhandled errors, silently swallowed
               failures, and public API changes without a stated reason.
            5. **Failing checks.** Any `fail` in the Check summary. Quote the output.
            6. **Missing tests.** New behaviour or a bug fix with no test that would fail
               without it. Tests must assert on the PDF's actual structure, not just "no throw".
            7. **License and dependencies.** Code or dependencies under an AGPL-incompatible
               license, copied code without attribution, unjustified new runtime dependencies.
            8. **CI and workflow security — when the diff touches `.github/`, do this first.**
               Read each changed workflow in full and compare with `git show origin/main:<path>`.
               Flag: PR-authored code running with secrets outside a same-repo `pull_request`
               job; attacker-controlled `${{ '${{' }} github.event.* }}` (titles, bodies, branch
               names) interpolated into `run:` (safe form: `env:` + `"$VAR"`); widened
               `permissions:` or triggers; secrets echoed or passed to a new or unpinned
               third-party action; dropped checksum verification; weakened `Verify a review was
               posted`, fallback, or `if:` skip conditions; an unconditional `github_token`; a
               step timeout at or above the job's; `| head` under pipefail; and comments that no
               longer match the YAML. `continue-on-error` on the model step is deliberate.

            ## Should flag (non-blocking, brief)

            - Needless verbosity: code, comments or docs longer than they need to be. This repo
              aims for well-tested, concise code.
            - Docs (`README.md`, `CLAUDE.md`) that now contradict the code.

            ## Do NOT flag

            Style or naming preferences, alternatives to a correct approach, pre-existing issues
            the PR does not touch, or anything you have not verified.

            ## Output

            Post **exactly ONE** review with `gh pr review ${{ steps.ctx.outputs.pr_number }}`:
            `--request-changes` if any check failed or a blocking issue exists, otherwise
            `--approve` with real-but-latent findings under `### Non-blocking notes`. Cite
            `path:line`, quote the code, and for each blocking finding state the input that
            reaches it. No praise, no restating the diff. End with one line:
            `Accessibility impact: <one sentence>`.

            Do not push commits, edit files, or comment by any other means.

      - name: Fallback review if Claude was cut off
        # Posts partial findings plus the check summary, as a review, so the PR always
        # carries a verdict.
        if: >-
          steps.guard.outputs.already_reviewed != 'true' &&
          steps.claude.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          # The model may have posted and then failed; don't double-post.
          COUNT=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --paginate \
            --jq ".[] | select(.user.login==\"claude[bot]\" or .user.login==\"github-actions[bot]\")
                      | select(.commit_id==\"$HEAD_SHA\") | .id" \
            | wc -l | tr -d ' ')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "A review already exists for $HEAD_SHA despite outcome=$OUTCOME — nothing to do."
            exit 0
          fi

          BODY=/tmp/fallback-review.md
          {
            printf '## Automated review did not complete\n\n'
            printf 'The review step ended with outcome `%s` (likely the 22-minute step timeout).\n' "$OUTCOME"
          } > "$BODY"
          if [ -s /tmp/review-findings.md ]; then
            {
              printf 'Findings recorded before it was cut off — **this list is incomplete**.\n\n---\n\n'
              head -c 60000 /tmp/review-findings.md
            } >> "$BODY"
          else
            printf 'No partial findings were recorded, so this PR has **not been reviewed**.\n' >> "$BODY"
          fi
          if [ -f /tmp/check-summary.md ]; then
            { printf '\n\n---\n\n'; cat /tmp/check-summary.md; } >> "$BODY"
          fi
          printf '\n\nRe-run with: `gh workflow run code-review.yml -f pr_number=%s`\n' "$PR_NUMBER" >> "$BODY"
          printf '\nAccessibility impact: not assessed — automated review was interrupted.\n' >> "$BODY"
          # --request-changes: an incomplete review must not read as a pass.
          gh pr review "$PR_NUMBER" --request-changes --body-file "$BODY"
          echo "::warning::Claude review was cut off (outcome=$OUTCOME); posted a fallback review."

      - name: Verify a review was posted
        # The action can exit 0 without calling `gh pr review`. Fail loudly instead.
        if: steps.guard.outputs.already_reviewed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --paginate \
            --jq ".[] | select(.user.login==\"claude[bot]\" or .user.login==\"github-actions[bot]\")
                      | select(.commit_id==\"$HEAD_SHA\") | .id" \
            | wc -l | tr -d ' ')
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::No review posted for $HEAD_SHA. Re-run with: gh workflow run code-review.yml -f pr_number=$PR_NUMBER"
            exit 1
          fi
          echo "review exists for $HEAD_SHA"
